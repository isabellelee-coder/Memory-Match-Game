<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Play | Memory Match</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game-pages.css">
</head>

<body>

    <main class="mm-page">

        <header class="mm-page-header">

            <a
                class="mm-back-link"
                href="index.html"
            >
                ← Back
            </a>

            <h1>Choose a Category</h1>

        </header>


        <section class="mm-category-grid">

            <article class="mm-level-choice">

                <h2>Memories</h2>

                <a
                    class="mm-button mm-button-primary"
                    href="play-category.html?category=memories"
                >
                    Memories
                </a>

            </article>


            <article class="mm-level-choice">

                <h2>Places</h2>

                <a
                    class="mm-button mm-button-primary"
                    href="play-category.html?category=places"
                >
                    Places
                </a>

            </article>


            <article class="mm-level-choice">

                <h2>People</h2>

                <a
                    class="mm-button mm-button-primary"
                    href="play-category.html?category=people"
                >
                    People
                </a>

            </article>


            <article class="mm-level-choice">

                <h2>Favorites</h2>

                <a
                    class="mm-button mm-button-primary"
                    href="play-category.html?category=favorites"
                >
                    Favorites
                </a>

            </article>


            <article class="mm-level-choice">

                <h2>Other</h2>

                <a
                    class="mm-button mm-button-primary"
                    href="play-category.html?category=other"
                >
                    Other
                </a>

            </article>

        </section>

    </main>

</body>
</html>
